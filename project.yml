name: SunMap
options:
  bundleIdPrefix: com.likewater
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: FMDJTXM4W7
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Where the app fetches tiles and sends "Request this area". Empty = unset
    # (sideloaded tiles only; button hidden). Set when hosting goes live, e.g.
    #   xcodebuild ... SUNMAP_BUNDLE_BASE_URL=https://sunmap-tiles.pages.dev/
    SUNMAP_BUNDLE_BASE_URL: ""
    SUNMAP_COVERAGE_REQUEST_URL: ""
packages:
  SunMapEngine:
    path: Engine
targets:
  SunMap:
    type: application
    platform: iOS
    sources:
      - path: Apps/SunMap
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SunMapEngine
        product: SunMapEngine
    info:
      path: Apps/SunMap/Info.plist
      properties:
        SunMapBundleBaseURL: "$(SUNMAP_BUNDLE_BASE_URL)"
        SunMapCoverageRequestURL: "$(SUNMAP_COVERAGE_REQUEST_URL)"
    settings:
      base:
        # Kept from before the split so installed copies and their downloaded cities survive.
        PRODUCT_BUNDLE_IDENTIFIER: com.likewater.sunmap
        INFOPLIST_KEY_CFBundleDisplayName: Sun Map
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Sun Map shows which sidewalks around you are in the sun right now."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  SunMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/SunMap
    dependencies:
      - target: SunMap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SunMap
schemes:
  SunMap:
    build:
      targets:
        SunMap: all
        SunMapUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SunMapUITests]
